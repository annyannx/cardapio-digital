spring.application.name=cardapio-api

# --- Banco de dados (a senha vem da variavel de ambiente DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardapio_digital}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT (RF005) ---
# A chave precisa ter pelo menos 32 caracteres. Este valor padrao serve so para
# desenvolvimento/demonstracao: em producao, defina a variavel de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-0123456789}
# Validade do token (8 horas)
app.jwt.expiracao-minutos=480

# --- Administrador inicial (criado automaticamente se nao existir) ---
# Valores padrao so para desenvolvimento/demonstracao. Para mudar, defina as
# variaveis de ambiente ADMIN_EMAIL e ADMIN_PASSWORD antes de ligar o sistema.
app.admin.email=${ADMIN_EMAIL:admin@cardapio.com}
app.admin.senha=${ADMIN_PASSWORD:admin123}
app.admin.nome=Administrador

# --- CORS: sites autorizados a chamar a API pelo navegador (separados por virgula) ---
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

# --- Upload de imagens (RF006) ---
# Limite de tamanho do arquivo enviado.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Endereco publico da API (usado para montar a URL das imagens guardadas localmente).
app.public-url=${PUBLIC_URL:http://localhost:8080}
# Pasta onde as imagens ficam quando o Cloudinary NAO esta configurado.
app.imagens.pasta-local=${IMAGENS_PASTA:uploads}
# Servico de imagens na nuvem (Cloudinary). Se estas duas variaveis estiverem
# preenchidas, as imagens vao para o Cloudinary; se estiverem vazias, usa a pasta local.
app.imagens.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.imagens.cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
